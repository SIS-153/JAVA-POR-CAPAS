version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: taller_modas_db
    environment:
      POSTGRES_DB: taller_modas
      POSTGRES_USER: alvaro
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taller_modas_network

  springboot_app:
    image: taller_modas_app
    container_name: taller_modas_app
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taller_modas
      SPRING_DATASOURCE_USERNAME: alvaro
      SPRING_DATASOURCE_PASSWORD: 123
    depends_on:
      - postgres
    networks:
      - taller_modas_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: taller_modas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: alvarto1296@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - taller_modas_network

volumes:
  postgres_data:

networks:
  taller_modas_network:
